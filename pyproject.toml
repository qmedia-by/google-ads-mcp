[project]
name = "google-ads-mcp"
version = "0.0.1"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "google-ads>=31.0.0",
    "mcp[cli]>=1.2.0",
    "fastmcp>=3.2.0",
    # ads_mcp/auth_storage.py imports key_value.aio.stores.redis, which lives behind
    # this extra. fastmcp pulls py-key-value-aio in without it, so a redis-backed
    # deployment fails at import time. Unpinned on purpose: the version is fastmcp's
    # to choose, we only need the extra.
    "py-key-value-aio[redis]",
    # ads_mcp/registry.py imports these directly. Both do arrive on their own —
    # httpx through mcp, google-auth through google-ads — and relying on that is
    # what broke the first deploy of the Registry: the image resolved without
    # httpx and the tool failed at runtime with ModuleNotFoundError, in front of
    # a Manager. A package we import is a package we declare, whatever else
    # happens to drag it in.
    "httpx",
    "google-auth",
    # ads_mcp/registry_cache.py imports it directly. It also arrives with the
    # extra above, but that extra is py-key-value-aio's promise about what *it*
    # needs, not ours.
    "redis",
]

description = "MCP Server for Google Ads, depends on Google Ads API."
readme = "README.md"
authors = [{ name = "Dean Lukies", email = "lukiesd@users.noreply.github.com" }]
keywords = ["Google Ads", "Google Ads API", "MCP"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python"
]

[project.optional-dependencies]
dev = [
    "black",
    "nox >=2025.5.1, <2026"
]

[project.urls]
homepage = "https://github.com/googleads/google-ads-mcp"
repository = "https://github.com/googleads/google-ads-mcp.git"
issues = "https://github.com/googleads/google-ads-mcp/issues"

[project.scripts]
google-ads-mcp = "ads_mcp.server:run_server"
google-ads-mcp-update-gaql = "ads_mcp.update_references:update_gaql_resource_file"

# The fork adds a top-level docker/ directory, which setuptools' flat-layout auto
# discovery treats as a second package and refuses to build ("Multiple top-level
# packages discovered in a flat-layout"). The shipped package is spelled out instead.
[tool.setuptools.packages.find]
include = ["ads_mcp*"]
