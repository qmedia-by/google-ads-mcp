name: CI

# Runs in exactly two situations, and there is no third on purpose.
#
# A pull request into dev is the one place this spends minutes on its own: when it is
# opened, on every push to the branch while it stays open, and if it is reopened. Those
# three are the default `types` for pull_request; they are written out because the point
# of this block is that somebody chose them.
#
# There is deliberately **no push trigger**. There used to be one — `branches-ignore:
# [dev]` — and it meant a branch with an open PR ran the whole matrix twice for every
# single push: once as `push`, once as `synchronize`. Six jobs became twelve, for the
# same commit. A branch with no PR needs no CI at all: nothing can reach dev from it
# without opening one.
#
# Pushes to dev are covered by `workflow_call` instead — deployment.yml calls this as its
# quality gate, so the suite still runs against the merge commit before anything ships.
on:
  workflow_call:
  pull_request:
    branches: [ dev ]
    types: [ opened, synchronize, reopened ]

# Three commits pushed in a row used to leave three full matrices running, of which only
# the last could still matter. Superseded PR runs are cancelled; a deploy gate never is,
# which is what the expression guards — for a `workflow_call` run `event_name` is the
# caller's `push`, so cancel-in-progress evaluates to false there.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black nox
      - name: Run lint
        run: nox -s lint

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox
      - name: Run tests
        run: nox -s tests-${{ matrix.python-version }}

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox .
      - name: Run smoke tests
        run: nox -s smoke_tests

